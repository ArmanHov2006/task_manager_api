<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; }
    .header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 18px; margin: 0 0 5px 0; color: #1a1a1a; }
    .subtitle { font-size: 12px; color: #666; }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    .status.active { background: #e8f5e9; color: #2e7d32; }
    .status.inactive { background: #ffebee; color: #c62828; }
    .auth-form { display: flex; flex-direction: column; gap: 10px; }
    input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button { padding: 10px; background: #1976d2; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; }
    button:hover { background: #1565c0; }
    .stats { margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 8px; font-size: 12px; }
    .stat-row { display: flex; justify-content: space-between; margin: 5px 0; }
    .stat-label { color: #666; }
    .stat-value { font-weight: 600; color: #1a1a1a; }
  </style>
  <script defer src="popup.js"></script>
  </head>
<body>
  <div class="header">
    <h1>👻 Phantom</h1>
    <div class="subtitle">Ambient Productivity AI</div>
  </div>
  <div id="status" class="status inactive">Not Connected</div>
  <div id="auth-section" class="auth-form">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">Connect to Phantom</button>
  </div>
  <div id="stats-section" style="display: none;">
    <div class="stats">
      <div class="stat-row"><span class="stat-label">Status:</span><span class="stat-value" id="mode">Monitoring</span></div>
      <div class="stat-row"><span class="stat-label">Active Domain:</span><span class="stat-value" id="domain">-</span></div>
      <div class="stat-row"><span class="stat-label">Open Tabs:</span><span class="stat-value" id="tabs">-</span></div>
    </div>
    <button id="logout-btn" style="margin-top: 10px; background: #d32f2f;">Disconnect</button>
  </div>
</body>
</html>
